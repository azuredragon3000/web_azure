name: Scrape Binance Warning Coins

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run warning scraper
        run: python scrape_warnings.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add warning_coins.json
          git diff --staged --quiet || git commit -m "chore: update warning coins list [skip ci]"
          git push
